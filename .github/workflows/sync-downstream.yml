- name: Verify downstream credentials
  env:
    DOWNSTREAM_URL: ${{ secrets.DOWNSTREAM_REPO_URL }}
  run: |
    set -euo pipefail

    if [ -z "$DOWNSTREAM_URL" ]; then
      echo "DOWNSTREAM_REPO_URL is empty"
      exit 1
    fi

    echo "Testing downstream read access..."
    git ls-remote "$DOWNSTREAM_URL"

    echo "Testing downstream write permission..."
    git push --dry-run "$DOWNSTREAM_URL" \
      HEAD:refs/heads/actions-permission-test

name: Sync to Downstream Repository

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test downstream access
        env:
          DOWNSTREAM_TOKEN: ${{ secrets.DOWNSTREAM_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$DOWNSTREAM_TOKEN" ]; then
            echo "DOWNSTREAM_REPO_TOKEN is missing"
            exit 1
          fi

          AUTH="$(printf 'x-access-token:%s' "$DOWNSTREAM_TOKEN" | base64 -w 0)"

          git -c "http.extraheader=Authorization: basic $AUTH" \
            ls-remote \
            https://github.com/nhsakil/Big_Bazar.git

      - name: Sync to downstream
        env:
          DOWNSTREAM_TOKEN: ${{ secrets.DOWNSTREAM_REPO_TOKEN }}
        run: |
          set -euo pipefail

          AUTH="$(printf 'x-access-token:%s' "$DOWNSTREAM_TOKEN" | base64 -w 0)"

          git -c "http.extraheader=Authorization: basic $AUTH" \
            push --force --prune \
            https://github.com/nhsakil/Big_Bazar.git \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

    echo "Checking downstream repository access..."
    curl --fail-with-body \
      -H "Authorization: Bearer $DOWNSTREAM_TOKEN" \
      https://api.github.com/repos/nhsakil/Big_Bazar
